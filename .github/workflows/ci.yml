name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  shellcheck:
    name: Scripts parse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash -n every script
        run: |
          fail=0
          while IFS= read -r s; do bash -n "$s" || { echo "::error file=$s::parse error"; fail=1; }; done \
            < <(find . -name '*.sh' -not -path './.git/*')
          exit $fail
      - name: node --check every mjs
        run: |
          fail=0
          while IFS= read -r f; do node --check "$f" || { echo "::error file=$f::parse error"; fail=1; }; done \
            < <(find . -name '*.mjs' -not -path './.git/*')
          exit $fail

  compose:
    name: Compose files are valid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose (base, then each overlay stacked on it)
        run: |
          # docker-compose.yml is the BASE and defines the sqlserver service.
          # The other files are OVERLAYS that add services depending on it, and
          # are invoked as `-f docker-compose.yml -f <overlay>`. Validating an
          # overlay on its own fails with "depends on undefined service".
          set -e
          base=local-test/docker-compose.yml
          echo "--- $base"
          SA_PASSWORD=dummy docker compose -f "$base" config -q
          for overlay in local-test/docker-compose.*.yml; do
            [ "$overlay" = "$base" ] && continue
            echo "--- $base + $overlay"
            SA_PASSWORD=dummy docker compose -f "$base" -f "$overlay" config -q
          done
          echo 'Compose files valid.'

  denylist:
    name: Sensitive denylist is a valid regex
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Denylist classifies correctly
        run: python skills/db-unit-test-synth/tests/check-denylist.py

  leak-scan:
    name: No internal identifiers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan
        run: |
          PAT='\b(sg|uk|us|id|st)-db[0-9]\b|wavecell|[Mm]essage[Ss]phere|WC_[A-Za-z_]+'
          PAT="$PAT"'|cpaas|CPAAS|8x8|\b(DBV|MSG|DBA)-[0-9]+\b'
          PAT="$PAT"'|AccountWallet|RoutingManager|SupplierList|SmsTraffic|DimCompanyEntity'
          PAT="$PAT"'|PricingPlanFutureStaging|RoutingPlanCoverage|SupplierConn|vwRoutingTier'
          PAT="$PAT"'|fnClassificationTemplateError|AccountManager|CmGroup|Pillar'
          PAT="$PAT"'|\b(cp|rt|ms|ipm|cls|map|tmpl)\.[A-Za-z_]{3,}'
          PAT="$PAT"'|[Oo]mnishield|[Vv]erif8|[Cc]hatApps|[Jj]itsi'
          # jenkins-bot: an internal service-account name, on its own (not just as the 8x8-prefixed
          # form already caught above). #1xxx: an upstream PR number surviving a comment rewrite.
          PAT="$PAT"'|jenkins-bot|#1[0-9]{3}\b'
          # Real region codes. Examples use region1..regionN and <regionN>-primary; the
          # alias form, the slash list and the hyphenated set all name live regions outright.
          PAT="$PAT"'|\b(sg|uk|us|id)-(primary|listener|nlb)\b|sg/id/uk/us|\bID-UK-US\b'
          # A bare region code used as a region, e.g. "on SG", "For SG that is". Anchored on
          # the preposition so it cannot fire on the ISO country code in the lookup seed.
          PAT="$PAT"'|\b(on|in|for|On|In|For) (SG|UK|US|ID)\b'
          if grep -rniE "$PAT" . --exclude-dir=.git --exclude-dir=.github; then
            echo "::error::internal identifier found"; exit 1
          fi
          echo 'Leak scan clean.'
